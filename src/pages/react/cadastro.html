<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/login.css" />
    <link rel="stylesheet" href="../../css/cadastro.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Cadastro</title>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      function App() {
        return (
          <main className="container">
            <section className="content">
              <div className="content-video">
                <video autoPlay muted loop className="fund-video">
                  <source src="../../videos/video.mp4" type="video/mp4" />
                </video>
              </div>
              <div className="login">
                <div className="form-login">
                  <h1 className="title">Cadastre-se</h1>
                  <p id="facaLogin">
                    Faça login abaixo ou cadastre-se para criar uma conta
                  </p>

                  <div className="content-logins">
                    <button className="btn-buttons google">Google</button>
                    <button className="btn-buttons face">Facebook</button>
                  </div>

                  <p id="ou">Ou</p>

                  <div className="content-inputs">
                    <input
                      className="inputs email"
                      type="email"
                      placeholder="Digite seu email..."
                    />
                    <input
                      type="password"
                      className="inputs"
                      placeholder="Digite sua senha..."
                    />
                    <input
                      type="password"
                      className="inputs confirmeSenha"
                      placeholder="Confirme sua senha..."
                    />
                  </div>

                  <button className="btn-login">Cadastrar</button>
                  <a className="linkEsqueceu-senha" href="index.html">
                    Faça login aqui
                  </a>
                </div>
              </div>
            </section>
          </main>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
