<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/login.css" />
    <link rel="stylesheet" href="../../css/cadastro.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="shortcut icon"
      href="../../images/favicon.png"
      type="image/x-icon"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Cadastro</title>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      function validarCadastro(email, senha, confirmarSenha, setErro) {
        if (!email) {
          setErro("Email é obrigatório.");
          return false;
        }

        if (!email.includes("@")) {
          setErro("Email deve conter @");
          return false;
        }

        if (!senha) {
          setErro("Senha é obrigatória.");
          return false;
        }

        if (senha.length < 6) {
          setErro("Senha precisa ter no mínimo 6+ caracteres.");
          return false;
        }

        if (!confirmarSenha) {
          setErro("Confirme a sua senha.");
          return false;
        }

        if (confirmarSenha !== senha) {
          setErro("As senhas não conferem.");
          return false;
        }

        setErro("");
        return true;
      }

      function App() {
        const [email, setEmail] = React.useState("");
        const [senha, setSenha] = React.useState("");
        const [confirmarSenha, setConfirmarSenha] = React.useState("");
        const [erro, setErro] = React.useState("");

        function handleSubmit(evento) {
          evento.preventDefault();
          const valido = validarCadastro(email, senha, confirmarSenha, setErro);

          if (valido) {
            alert("Cadastro realizado com sucesso!");
          }
        }

        return (
          <main className="container">
            <section className="content">
              <div className="content-video">
                <video autoPlay muted loop className="fund-video">
                  <source src="../../videos/video2.mp4" type="video/mp4" />
                </video>
              </div>
              <div className="login">
                <div className="form-login">
                  <h1 className="title">Cadastre-se</h1>
                  <p id="facaLogin">
                    Faça seu cadastro abaixo para criar uma conta!
                  </p>

                  <div className="content-logins">
                    <button className="btn-buttons google">Google</button>
                    <button className="btn-buttons face">Facebook</button>
                  </div>

                  <p id="ou">Ou</p>
                  <form onSubmit={handleSubmit}>
                    <div className="content-inputs">
                      <input
                        id="email"
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        className="inputs email"
                        type="email"
                        placeholder="Digite seu email..."
                      />
                      <input
                        id="senha"
                        value={senha}
                        onChange={(e) => setSenha(e.target.value)}
                        type="password"
                        className="inputs"
                        placeholder="Digite sua senha..."
                      />
                      <input
                        id="confirmarSenha"
                        value={confirmarSenha}
                        onChange={(e) => setConfirmarSenha(e.target.value)}
                        type="password"
                        className="inputs confirmeSenha"
                        placeholder="Confirme sua senha..."
                      />
                    </div>

                    {erro && <p id="erroCadastro">{erro}</p>}

                    <button type="submit" className="btn-login">
                      Cadastrar
                    </button>
                  </form>
                  <div className="content-alterandoPagina">
                    <span>
                      Tem conta?{" "}
                      <a className="linkEsqueceu-senha" href="index.html">
                        Faça login aqui
                      </a>
                    </span>
                  </div>
                </div>
              </div>
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
