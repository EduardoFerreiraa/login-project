<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Login</title>
  </head>
  <body id="body">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      function App() {
        return (
          <main className="container">
            <section className="content">
              <div className="content-video">
                <video autoPlay muted loop className="fund-video">
                  <source src="../../videos/video3.mp4" type="video/mp4" />
                </video>
              </div>
              <div className="login">
                <div className="form-login">
                  <h1 className="title">Login</h1>
                  <p id="facaLogin">
                    Faça login abaixo ou cadastre-se para criar uma conta
                  </p>

                  <div className="content-logins">
                    <button className="btn-buttons google">Google</button>
                    <button className="btn-buttons face">Facebook</button>
                  </div>

                  <p id="ou">Ou</p>
                  <form id="form">
                    <div className="content-inputs">
                      <input
                        id="email"
                        className="inputs email"
                        type="email"
                        placeholder="Digite seu email..."
                      />
                      <input
                        id="senha"
                        type="password"
                        className="inputs senha"
                        placeholder="Digite sua senha..."
                      />
                    </div>

                    <button className="btn-login" type="submit">
                      Log in
                    </button>
                  </form>
                  <a className="linkEsqueceu-senha" href="cadastro.html">
                    Esqueceu a senha?
                  </a>
                </div>
              </div>
            </section>
          </main>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
    <script type="text/javascript" src="../scripts/validarLogin.js"></script>
  </body>
</html>
